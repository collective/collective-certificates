name: Documentation

# The steps of plone/meta's docs-build.yml, plus an upload of the built HTML,
# which pages.yml publishes to GitHub Pages together with Storybook.

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: docs
    outputs:
      artifact-name:
        description: "Name of the uploaded HTML artifact"
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:

  build:
    name: "Docs: Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      artifact-name: docs-html
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup uv
        uses: plone/meta/.github/actions/setup_uv@2.x
        with:
          python-version: ${{ inputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Install Dependencies
        shell: bash
        run: make install

      - name: Check for broken links
        shell: bash
        run: |
          make linkcheckbroken

      - name: Build HTML documentation
        shell: bash
        run: |
          make build

      - name: Run vale checks
        shell: bash
        run: |
          make vale VALEOPTS="--minAlertLevel='warning'"

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: ${{ inputs.working-directory }}/_build/html
          if-no-files-found: error
