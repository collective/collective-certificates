name: CI

on:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/*.yml"
      - "*.md"
      - "*.toml"
      - "docker-compose*"
      - "docs/**"

  workflow_dispatch:

jobs:
  config:
    uses: ./.github/workflows/config.yml

  backend:
    uses: ./.github/workflows/backend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: backend
        python-version: ${{ needs.config.outputs.python-version }}
        plone-version: ${{ needs.config.outputs.plone-version }}
    if: ${{ needs.config.outputs.backend == 'true' }}
    permissions:
      contents: read
      packages: write
  # The documentation and Storybook build whenever their sources change, and
  # on main also whenever anything on the published site changes, so that
  # the deployment always carries both.
  docs:
    uses: ./.github/workflows/docs.yml
    needs:
        - config
    with:
      python-version: ${{ needs.config.outputs.python-version }}
    if: ${{ needs.config.outputs.docs == 'true' || (needs.config.outputs.pages == 'true' && github.ref == 'refs/heads/main') }}

  storybook:
    uses: ./.github/workflows/storybook.yml
    needs:
        - config
    with:
      node-version: ${{ needs.config.outputs.node-version }}
    if: ${{ needs.config.outputs.frontend == 'true' || (needs.config.outputs.pages == 'true' && github.ref == 'refs/heads/main') }}

  pages:
    uses: ./.github/workflows/pages.yml
    needs:
        - config
        - docs
        - storybook
        - backend
        - frontend
    with:
      docs-artifact-name: ${{ needs.docs.outputs.artifact-name }}
      storybook-artifact-name: ${{ needs.storybook.outputs.artifact-name }}
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.config.outputs.pages == 'true' && needs.docs.result == 'success' && needs.storybook.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write

  frontend:
    uses: ./.github/workflows/frontend.yml
    needs:
        - config
    with:
        base-tag: ${{ needs.config.outputs.base-tag }}
        image-name-prefix: ${{ needs.config.outputs.image-name-prefix }}
        image-name-suffix: frontend
        node-version: ${{ needs.config.outputs.node-version }}
        volto-version: ${{ needs.config.outputs.volto-version }}
    if: ${{ needs.config.outputs.frontend == 'true' }}
    permissions:
      contents: read
      packages: write

  report:
    name: "Final report"
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - config
      - backend
      - frontend
      - docs
      - storybook
      - pages
    steps:
      - name: Write report
        run: |
          echo '# Workflow Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job ID | Conclusion |' >> $GITHUB_STEP_SUMMARY
          echo '| --- | --- |' >> $GITHUB_STEP_SUMMARY
          echo '| config | ${{ needs.config.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| backend | ${{ needs.backend.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| frontend | ${{ needs.frontend.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| docs | ${{ needs.docs.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| storybook | ${{ needs.storybook.result }} |' >> $GITHUB_STEP_SUMMARY
          echo '| pages | ${{ needs.pages.result }} |' >> $GITHUB_STEP_SUMMARY
